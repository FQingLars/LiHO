[package]
name = "LIhO"
version = "0.2.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.10"
log = "0.4"
dotenvy = "0.15"
futures-util = "0.3"
tokio = { version = "1.38", features = ["full"] }
wasmi = "1.1.0"
base64 = "0.23.1"
# Ctrl-C / SIGTERM handling that compiles on Windows as well.
ctrlc = { version = "3.4", features = ["termination"] }
sha3 = "0.10"
# Streaming ASR (t-tech/T-one, ONNX Runtime) + 16-bit audio for the model.
ort = { version = "2.0.0-rc.12", features = ["half"] }
half = "2"
# Cross-platform microphone capture (WASAPI / PulseAudio / ALSA / CoreAudio).
cpal = "0.15"

# The overlay is a Wayland layer-shell: Linux only. Windows and macOS fall
# back to the console backend (see src/display/mod.rs).
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
smithay-client-toolkit = "0.21"
cosmic-text = "0.19"
tiny-skia = "0.12"
calloop = "0.14"
calloop-wayland-source = "0.4"

[dev-dependencies]
hound = "3.5"